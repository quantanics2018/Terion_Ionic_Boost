  <!DOCTYPE html>
  <html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <title>Ionic Boost</title>
    <style>

    /* Your existing CSS (unchanged) */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      background: #f5f5f5;
      border-bottom: 2px solid #ddd;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-container img {
      height: 80px;
    }

    .logo-container p {
      font-size: 20px;
      font-weight: bold;
      color: #222;
      margin: 0;
    }

    .welcome {
      font-size: 18px;
      text-align: right;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .login-btn {
      background: #00bfbf;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-left: 10px;
      font-size: 14px;
  transition: background 0.3s ease, transform 0.2s ease;
    }

    .login-btn:hover {
      background: #009999;
    transform: scale(1.05); /* ✅ subtle hover effect */

    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .profile-menu {
      position: relative;
      display: inline-block;
    }

    .hamburger {
      width: 36px;
      height: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .hamburger span {
      display: block;
      height: 5px;
      background: #00bfbf;
      border-radius: 3px;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background: #fff;
      min-width: 200px;
      box-shadow: 0px 6px 12px rgba(0,0,0,0.2);
      border-radius: 6px;
      z-index: 100;
      font-size: 16px;
    }

    .dropdown-content a {
      display: block;
      padding: 12px;
      text-decoration: none;
      color: #333;
      font-size: 16px;
    }

    .dropdown-content a:hover {
      background: #f5f5f5;
    }

    .show {
      display: block;
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      background: #000;
      padding: 15px 0;
    }

    .nav-bar a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      margin: 0 25px;
      font-size: 20px;
      transition: color 0.3s ease;
    }

    .nav-bar a:hover {
      color: #00bfbf;
      text-decoration: none;
    }

    /* ✅ Optional styling for Google dropdown */
    html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
  }

  /* Fix translate dropdown width issue */
  @media (max-width: 370px) {
    .welcome {
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    #google_translate_element {
      order: -1;
      margin-right: 0;
      margin-bottom: 6px;
    }

    .login-btn {
      align-self: flex-end;
    }
  }

  .track-btn {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .track-btn:hover {
      background: #005fa3;
      transform: scale(1.05);
    }

  #google_translate_element select {
    max-width: 120px !important;
    font-size: 12px !important;
    padding: 3px 6px !important;
    height: auto !important;
    line-height: normal !important;
  }
  .welcome-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.8rem;
    background: linear-gradient(135deg, #ff9900, #ff5f5f, #ff33cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img src="{{ url_for('static', filename='img/IB logo mil-un-page014.png') }}" alt="Ionic Boost Logo" oncontextmenu="return false;">
            </div>
          <h3 class="welcome-text">Welcome {{ username if username else 'Guest' }}</h3>

      <div class="welcome">
        <!-- ✅ Google Translate -->
        <div id="google_translate_element" style="margin-right:15px;"></div>

        {% if user %}
        <!-- ✅ Track Orders button (visible only when user logged in) -->
          <a href="/orders">
            <button class="track-btn">Previous Orders</button>
          </a>
          <div class="user-info">
            <div class="profile-menu">
              <div class="hamburger" onclick="toggleDropdown()">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div id="dropdown" class="dropdown-content">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('purchase') }}">Purchase</a>
                <a href="{{ url_for('edit_profile') }}">Edit Profile</a>
                <a href="{{ url_for('logout') }}">Logout</a>
              </div>
            </div>
          </div>
        {% else %}
          <a href="{{ url_for('login') }}">
            <button class="login-btn">Login</button>
          </a>
        {% endif %}
      </div>
    </header>

    <!-- ✅ Navigation -->
    <div class="nav-bar">
      <a href="#">Save Diesel.</a>
      <a href="#">Earn More.</a>
      <a href="#">Drive Smarter.</a>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("img").forEach(img => {
        img.oncontextmenu = () => false;  // disable right click
        img.setAttribute("draggable", "false"); // disable drag
      });
    });
    function toggleDropdown() {
      document.getElementById("dropdown").classList.toggle("show");
    }

    window.onclick = function(event) {
      if (!event.target.closest('.profile-menu')) {
        let dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
          let openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }
    </script>

    <!-- ✅Google Translate Script -->
    <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {pageLanguage: 'en'}, 
        'google_translate_element'
      );
    }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
  </html>
