<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - TERiON INNOVIX</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #333;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .address-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      margin: 10px 0;
      background: #fafafa;
    }
    label {
      font-weight: 600;
      display: block;
      margin-top: 15px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    .hidden {
      display: none;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      font-size: 16px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-submit:hover {
      background: #218838;
    }
  </style>
</head>
<body>

{% include 'header.html' %}

<div class="container">
  <h2>Checkout</h2>

  <!-- We use id="checkout-form" but not action — handled by JS -->
  <form id="checkout-form">

    <label>
      <input type="radio" name="use_existing" value="yes" checked>
      Use my saved address
    </label>
    <div class="address-box">
      <p><strong>{{ user }}</strong></p>
      <p>{{ user_data.address }}, {{ user_data.city }}</p>
      <p>{{ user_data.state }} - {{ user_data.pincode }}</p>
      <p>{{ user_data.whatsapp_number }} - {{ user_data.email }}</p>
    </div>

 <!--   <label>
      <input type="radio" name="use_existing" value="no">
      Enter a new address
    </label>-->

    <div id="new-address" class="hidden">
      <label>Address</label>
      <input type="text" name="address" placeholder="Address">
      <label>City</label>
      <input type="text" name="city" placeholder="City">
      <label>State</label>
      <input type="text" name="state" placeholder="State">
      <label>Pincode</label>
      <input type="text" name="pincode" placeholder="Pincode">
    </div>

    <label>Payment Method</label>
    <select name="payment">
      <option value="UPI">UPI</option>
    </select>

    <button type="button" class="btn-submit" id="pay-btn">Place Order</button>
  </form>
</div>

{% include 'footer.html' %}
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  document.getElementById("pay-btn").onclick = function(e) {
      e.preventDefault(); // prevent default form submit
  
      var options = {
          "key": "{{ key_id|default('') }}",
          "amount" : {{ amount  }}* 100, // in paise
          "currency": "INR",
          "order_id": "{{ order_id|default('') }}",
          "name": "My Shop",
          "description": "Test Transaction",
  
          // ✅ Success handler
          "handler": function (response) {
              fetch("/verify", {
                  method: "POST",
                  headers: {"Content-Type": "application/x-www-form-urlencoded"},
                  body: new URLSearchParams({
                      "razorpay_payment_id": response.razorpay_payment_id,
                      "razorpay_order_id": response.razorpay_order_id,
                      "razorpay_signature": response.razorpay_signature,
                      "name": "{{ user }}",
                      "email": "{{ user_data.email }}",
                      "whatsapp_number": "{{ user_data.whatsapp_number }}",
                      "address": "{{ user_data.address }}",
                      "city": "{{ user_data.city }}",
                      "state": "{{ user_data.state }}",
                      "pincode": "{{ user_data.pincode }}"
                  })

              })
                .then(async (r) => {
                  if (r.ok) {
                      const html = await r.text(); 
                      document.open();
                      document.write(html);
                      document.close();
                  } else {
                      window.location = "/failed";
                  }
              })
              .catch(() => {
                  window.location = "/failed"; // fallback
              });
          },
  
          // ✅ Payment method options
          "method": {
              "upi": true,
              "card": false,
              "netbanking": false,
              "wallet": false,
              "emi": false,
              "paylater": false
          }
      };
  
      var rzp1 = new Razorpay(options);
  
      // ✅ Handle failure case
      rzp1.on('payment.failed', function (response){
          alert("Payment Failed: " + response.error.description);
          window.location = "/failed";  // redirect to failure page
      });
  
      rzp1.open();
  };
  </script>
   

</body>
</html>
